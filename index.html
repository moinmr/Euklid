<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5ebd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Euklid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Euklid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap">
<link rel="stylesheet" href="kern/stil.css">
</head>
<body>
<!-- Nur der Rahmen. Die Bereiche (Ordner bereiche/) und ihre Level hängen sich beim Start selbst ein. -->
<div id="app">
  <canvas id="board"></canvas>
  <div id="mach" hidden></div>
  <!-- Oben: Allgemeines und der Aufgabentext. Unten: die Werkzeuge des Levels. -->
  <div id="top">
    <div id="bar" class="bar" role="toolbar" data-aria="navigation">
      <span class="side"><button class="ib" id="b-home" data-aria="startseite"><svg viewBox="0 0 24 24"><path d="M4.5 11L12 4.5L19.5 11M6.5 9.5V19.5H17.5V9.5"/></svg></button></span>
      <span class="mid">
        <button class="ib" id="b-prev" data-aria="vorheriges"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12L14.5 18.5"/></svg></button>
        <button class="ib" id="b-level" data-aria="naechstes"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12L9.5 18.5"/></svg></button>
      </span>
      <span class="side r">
        <button class="ib" id="b-task" data-aria="aufgabe"><svg viewBox="0 0 24 24"><path d="M4.5 5.5H19.5V15.5H11L7 19V15.5H4.5Z"/></svg></button>
        <button class="ib lang" id="b-lang" data-aria="sprache"></button>
      </span>
    </div>
  </div>
  <div id="hud" aria-live="polite"></div>
  <div id="bottom">
    <div id="tools" class="bar" role="toolbar" data-aria="werkzeuge">
      <button class="ib" id="b-point" data-aria="punkt" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 3V6.5M12 17.5V21M3 12H6.5M17.5 12H21"/></svg></button>
      <button class="ib" id="b-line" data-aria="linie"><svg viewBox="0 0 24 24"><path d="M4.8 17.4 L19.2 6.6"/><circle class="f" cx="4.8" cy="17.4" r="1.4"/><circle class="f" cx="19.2" cy="6.6" r="1.4"/></svg></button>
      <button class="ib" id="b-compass" data-aria="zirkel"><svg viewBox="0 0 24 24"><path d="M6.6 20.1 L12 3.9 L17.4 20.1"/></svg></button>
      <button class="ib" id="b-move" data-aria="schieben"><svg viewBox="0 0 24 24"><path d="M12 12H20.1M17.85 9.75L20.1 12L17.85 14.25M12 12H3.9M6.15 9.75L3.9 12L6.15 14.25M12 12V3.9M9.75 6.15L12 3.9L14.25 6.15M12 12V20.1M9.75 17.85L12 20.1L14.25 17.85"/></svg></button>
      <button class="ib" id="b-cut" data-aria="trennen"><svg viewBox="0 0 24 24"><path d="M7.95 18.3L16.95 3.45M16.05 18.3L7.05 3.45"/><circle cx="7.95" cy="18.3" r="1.8"/><circle cx="16.05" cy="18.3" r="1.8"/></svg></button>
      <button class="ib" id="b-undo" data-aria="zurueck"><svg viewBox="0 0 24 24"><path d="M8.5 5.5L5 9L8.5 12.5M5 9H14.5A4.75 4.75 0 0 1 14.5 18.5H9"/></svg></button>
      <button class="ib" id="b-clear" data-aria="loeschen"><svg viewBox="0 0 24 24"><path d="M4.8 6.6H19.2M6.6 6.6L7.5 20.1H16.5L17.4 6.6"/></svg></button>
      <button class="ib" id="b-view" data-aria="ansicht"><svg viewBox="0 0 24 24"><path d="M4.35 8.4V4.35H8.4M19.65 8.4V4.35H15.6M4.35 15.6V19.65H8.4M19.65 15.6V19.65H15.6"/></svg></button>
    </div>
  </div>
  <div id="home">
    <button id="h-set" data-aria="sprachen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.6" ry="8.6"/><path d="M3.4 12H20.6M4.9 7.3H19.1M4.9 16.7H19.1"/></svg></button>
    <button id="h-lang" data-aria="sprache"></button>
    <h1 data-t="mathe"></h1>
    <p class="sub" data-t="waehle"></p>
    <div id="areas"></div>
    <button id="h-reset" data-t="zuruecksetzen"></button>
  </div>
  <!-- Auswahl der zwei Sprachen, geöffnet mit dem Globus auf der Startseite -->
  <div id="langpick" hidden role="dialog" data-aria="sprachen"><div class="sheet"></div></div>
  <!-- Nachfrage vor dem Zurücksetzen aller Level -->
  <div id="resetpick" hidden role="dialog" data-aria="zuruecksetzen"><div class="sheet">
    <h2 data-t="zuruecksetzenFrage"></h2><p data-t="zuruecksetzenText"></p>
    <div class="zwei"><button class="nein" data-t="abbrechen"></button><button class="ja" data-t="ja_zuruecksetzen"></button></div>
  </div></div>
</div>

<script src="kern/dateien.js"></script>
<script src="bereiche/liste.js"></script>
<script>
App.dateienLaden(function () { App.start(); });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
