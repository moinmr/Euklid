<style>
/* Layout: Vollbild-Zeichenbrett, dünne Symbolleiste und Aufgabentext oben darüber. Ein fester Look (Pergament + Tinte). */
:root {
  --parchment: #f5ebd1;
  --ink: #382919;
  --pencil: #73737a;
  --blue: #1a59cc;
  --green: #1ab333;
  --font-ui: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--parchment);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { position: relative; height: 100%; height: 100dvh; width: 100%; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#top {
  padding-top: env(safe-area-inset-top, 0px);
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  padding-bottom: 14px;
  background: linear-gradient(to bottom, var(--parchment) 72%, rgba(245,235,209,0));
}
#bar { display: flex; gap: 2px; padding: 2px 0; max-width: 560px; margin: 0 auto; }
.ib {
  pointer-events: auto;
  flex: 1 1 0; min-width: 0; height: 52px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; margin: 0;
  color: var(--ink); cursor: pointer;
  touch-action: manipulation;
}
.ib svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ib svg .f { fill: currentColor; stroke: none; }
.ib.on { color: var(--blue); }
.ib:active { opacity: .45; }
.ib:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; border-radius: 8px; }
#hud {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 26px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--parchment) 70%, rgba(245,235,209,0));
  text-align: center; font-size: 14.5px; font-weight: 400; line-height: 1.4; letter-spacing: .01em; text-wrap: balance;
  pointer-events: none;
}
#hud b { display: block; font-weight: 700; }
#hud.ok { color: var(--green); font-weight: 400; }
[hidden] { display: none !important; }
#home {
  position: absolute; inset: 0; z-index: 5; background: var(--parchment);
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  overflow: hidden;
}
#home[hidden] { display: none; }
#home h1 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: .02em; text-align: center; }
#home .sub { margin: -18px 0 0; font-size: 15px; font-weight: 400; text-align: center; opacity: .7; }
#areas { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 440px; }
.area {
  display: flex; align-items: center; gap: 18px; width: 100%;
  padding: 20px 18px; text-align: left;
  background: none; color: var(--ink); font-family: var(--font-ui);
  border: 1.2px solid var(--ink); border-radius: 14px; cursor: pointer;
  touch-action: manipulation;
}
.area:active { opacity: .5; }
.area:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.area svg { flex: none; width: 46px; height: 50px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.area .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.area .n { font-size: 24px; font-weight: 400; line-height: 1.1; }
.area .s { font-size: 14.5px; font-weight: 400; opacity: .7; }
.area[aria-disabled="true"] { opacity: .5; cursor: default; border-style: dashed; }
.area[aria-disabled="true"]:active { opacity: .5; }
</style>

<div id="app">
  <canvas id="board"></canvas>
  <div id="top">
    <div id="bar" role="toolbar" aria-label="Werkzeuge">
      <button class="ib" id="b-home" aria-label="Startseite"><svg viewBox="0 0 24 24"><path d="M4.5 11L12 4.5L19.5 11M6.5 9.5V19.5H17.5V9.5"/></svg></button>
      <button class="ib" id="b-line" aria-label="Linie"><svg viewBox="0 0 24 24"><path d="M4.8 17.4 L19.2 6.6"/><circle class="f" cx="4.8" cy="17.4" r="1.4"/><circle class="f" cx="19.2" cy="6.6" r="1.4"/></svg></button>
      <button class="ib" id="b-compass" aria-label="Zirkel"><svg viewBox="0 0 24 24"><path d="M6.6 20.1 L12 3.9 L17.4 20.1"/></svg></button>
      <button class="ib" id="b-move" aria-label="Ecke schieben"><svg viewBox="0 0 24 24"><path d="M12 12H20.1M17.85 9.75L20.1 12L17.85 14.25M12 12H3.9M6.15 9.75L3.9 12L6.15 14.25M12 12V3.9M9.75 6.15L12 3.9L14.25 6.15M12 12V20.1M9.75 17.85L12 20.1L14.25 17.85"/></svg></button>
      <button class="ib" id="b-cut" aria-label="Trennen"><svg viewBox="0 0 24 24"><path d="M7.95 18.3L16.95 3.45M16.05 18.3L7.05 3.45"/><circle cx="7.95" cy="18.3" r="1.8"/><circle cx="16.05" cy="18.3" r="1.8"/></svg></button>
      <button class="ib" id="b-undo" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M19.65 12H4.35M8.85 7.95L4.35 12L8.85 16.05"/></svg></button>
      <button class="ib" id="b-clear" aria-label="Alles löschen"><svg viewBox="0 0 24 24"><path d="M4.8 6.6H19.2M6.6 6.6L7.5 20.1H16.5L17.4 6.6"/></svg></button>
      <button class="ib" id="b-view" aria-label="Ansicht zurücksetzen"><svg viewBox="0 0 24 24"><path d="M4.35 8.4V4.35H8.4M19.65 8.4V4.35H15.6M4.35 15.6V19.65H8.4M19.65 15.6V19.65H15.6"/></svg></button>
      <button class="ib" id="b-level" aria-label="Nächstes Level"><svg viewBox="0 0 24 24"><path d="M4.35 19.65V14.7H9.3V9.75H14.25V4.8H19.65"/></svg></button>
    </div>
  </div>
  <div id="hud" aria-live="polite"></div>
  <div id="home">
    <h1>Mathe</h1>
    <p class="sub">Wähle einen Bereich</p>
    <div id="areas">
      <button class="area" id="a-euklid">
        <svg viewBox="0 0 40 44"><path d="M6 36H34L20 11.8Z"/><path d="M8.44 8.11A28 28 0 0 1 28.94 19.94M31.56 8.11A28 28 0 0 0 11.06 19.94"/></svg>
        <span class="t"><span class="n">Euklid</span><span class="s" id="euklid-stand"></span></span>
      </button>
      <button class="area" id="a-funk">
        <svg viewBox="0 0 40 44"><path d="M6 6V38H38M10 33C18 32 25 22 34 9"/></svg>
        <span class="t"><span class="n">Funktionen</span><span class="s" id="funk-stand"></span></span>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ===================== Konstanten ===================== */
var PARCH = '#f5ebd1', INK = '#382919';
var PENCIL = 'rgb(115,115,122)', PENCIL_A = 'rgba(115,115,122,0.8)';
var BLUE = 'rgb(26,89,204)', BASEC = 'rgb(26,26,26)';
var GREEN = 'rgb(26,179,51)', RED = 'rgb(230,26,26)';
var GRAB = 36;            // Greif-/Einrastradius (px)
var ZOOM = 2.5;           // Lupe
var LOUPE_R = 46, LOUPE_OFFSET = 95;
var LIFT_DELAY = 0.09;    // Sekunden
var CM = 38;              // px pro cm
var COMPASS_SNAP = true;
var FONT = '"Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
var TAU = Math.PI * 2;
var STORE_KEY = 'euklid-fortschritt-v1';

var LEVELS = [
  { kind: 'tri', title: 'Level 1: Gleichseitiges Dreieck',
    task: 'Konstruiere über der Strecke AB ein gleichseitiges Dreieck. Benutze Zirkel und Linie.' },
  { kind: 'hex', title: 'Level 2: Sechseck',
    task: 'Konstruiere über der Strecke AB ein regelmäßiges Sechseck. Benutze Zirkel und Linie.' },
  { kind: 'perp', title: 'Level 3: Mittelsenkrechte', y: 0.45,
    task: 'Konstruiere die Mittelsenkrechte der Strecke AB. Benutze Zirkel und Linie.' }
];

/* ===================== Zustand ===================== */
var S = {
  tool: 'line', edges: [], circles: [], gid: 0, cc: null, level: null, done: false, base: null,
  solved: new Set(), solutions: {}, work: {}, start_level: 0, ls: null, cc_gid: 0, pa: 0,
  vs: 1, ox: 0, oy: 0, k: 1, vth: 0, dsc: 1,
  hist: [], fingers: new Map(), gesture: false, main: null, sp: [0, 0], loupe: null,
  active_orig: null, w: 0, h: 0, dpr: 1, loadedOnce: false, mode: 'home',
  onLevel: null, onRender: null,
  // Zwischenzustand (reset_temp)
  start: null, end: null, active: null, target: null, drawing: false, lmode: null, cutting: false,
  cmode: null, sweep: 0, lo: 0, hi: 0, pa0: 0, last: 0, rad_old: 0, rad: 0
};

function V(p) { return { x: p[0], y: p[1], locked: false, name: null }; }
function vp(v) { return [v.x, v.y]; }
function unit(a, b) {
  var dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1;
  return [dx / n, dy / n];
}
function distCm(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]) / CM; }
function now() { return (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000; }
function render() { if (S.onRender) S.onRender(); }

function resetTemp() {
  S.start = null; S.end = null; S.active = null; S.target = null; S.drawing = false;
  S.lmode = null; S.cutting = false; S.cmode = null; S.sweep = 0; S.lo = 0; S.hi = 0;
  S.pa0 = 0; S.last = 0; S.rad_old = 0; S.rad = 0;
}

/* ===================== Hilfsfunktionen ===================== */
function vertices() {
  var seen = new Set(), out = [];
  S.edges.forEach(function (e) {
    [e.a, e.b].forEach(function (v) { if (!seen.has(v)) { seen.add(v); out.push(v); } });
  });
  return out;
}
function snap(pos, exclude, minDeg) {
  minDeg = minDeg || 1;
  var deg = new Map();
  if (minDeg > 1) {
    S.edges.forEach(function (e) {
      deg.set(e.a, (deg.get(e.a) || 0) + 1);
      deg.set(e.b, (deg.get(e.b) || 0) + 1);
    });
  }
  var best = null, bd = GRAB * S.k;
  vertices().forEach(function (v) {
    if (v === exclude) return;
    if ((deg.get(v) || 1) < minDeg) return;
    var d = Math.hypot(v.x - pos[0], v.y - pos[1]);
    if (d < bd) { best = v; bd = d; }
  });
  return best;
}
function csnap(pos, exclude) { return COMPASS_SNAP ? snap(pos, exclude) : null; }
function radiusAt(pos) {
  var tg = csnap(pos, S.cc);
  var q = tg ? vp(tg) : pos;
  var dx = q[0] - S.cc.x, dy = q[1] - S.cc.y;
  S.pa = Math.atan2(dy, dx);
  return Math.hypot(dx, dy);
}

/* ===================== Zeichnen ===================== */
function dotAt(ctx, p, big, size) {
  var r = S.k * S.dsc * (size ? size : (big ? 9 : 4));
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill();
}
function mark(ctx, v) {
  ctx.fillStyle = S.tool === 'cut' ? RED : GREEN;
  var r = 11 * S.k * S.dsc;
  ctx.beginPath(); ctx.arc(v.x, v.y, r, 0, TAU); ctx.fill();
}
function arcLine(ctx, c, r, a0, sw, width) {
  ctx.lineWidth = width;
  ctx.beginPath(); ctx.arc(c[0], c[1], r, a0, a0 + sw); ctx.stroke();
}
function text(ctx, txt, x, y, col, size) {
  var k = S.k;
  ctx.fillStyle = col;
  ctx.font = '400 ' + ((size || 12) * k) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(x, y);
  if (Math.abs(S.vth) > 1e-6) ctx.rotate(-S.vth);   // Ansicht gedreht: Text bleibt aufrecht
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}

function buildScene(ctx, ws) {
  var k = S.k;
  var adj = new Map(), vcol = new Map();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  S.edges.forEach(function (e) {
    if (!adj.has(e.a)) adj.set(e.a, []);
    if (!adj.has(e.b)) adj.set(e.b, []);
    adj.get(e.a).push(e.b); adj.get(e.b).push(e.a);
    if (!vcol.has(e.a)) vcol.set(e.a, e.col);
    if (!vcol.has(e.b)) vcol.set(e.b, e.col);
  });
  S.edges.forEach(function (e) {
    ctx.strokeStyle = e.col; ctx.lineWidth = 2.5 * ws * k;
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
  });
  S.circles.forEach(function (c) {
    ctx.strokeStyle = PENCIL_A;
    arcLine(ctx, vp(c.c), c.r, c.a0, c.sw, 1.1 * ws * k);
  });
  adj.forEach(function (nb, v) {
    ctx.fillStyle = vcol.get(v);
    dotAt(ctx, vp(v), v === S.active);
    if (nb.length === 2 && nb[0] !== nb[1]) {
      var u = unit(vp(v), vp(nb[0])), w = unit(vp(v), vp(nb[1]));
      var d = Math.max(-1, Math.min(1, u[0] * w[0] + u[1] * w[1]));
      var ang = Math.acos(d) * 180 / Math.PI;
      var bx = u[0] + w[0], by = u[1] + w[1], bn = Math.hypot(bx, by);
      if (bn < 1e-6) { bx = -u[1]; by = u[0]; bn = 1; }
      text(ctx, Math.round(ang) + '°', v.x + bx / bn * 32 * k, v.y + by / bn * 32 * k, vcol.get(v));
    }
  });
  if (S.target) mark(ctx, S.target);
  if (S.base) S.base.forEach(function (v) {
    if (v.name) text(ctx, v.name, v.x, v.y + 17 * k, INK, 14);
  });
}

function buildTemp(ctx, ws) {
  var k = S.k;
  ctx.lineCap = 'butt';
  if (S.tool === 'line') {
    ctx.strokeStyle = BLUE; ctx.fillStyle = BLUE;
    if (S.ls) dotAt(ctx, vp(S.ls), true);
    if (S.drawing && S.end) {
      if (S.lmode === 'end' && S.ls) {
        ctx.lineWidth = 2 * ws * k;
        ctx.beginPath(); ctx.moveTo(S.ls.x, S.ls.y); ctx.lineTo(S.end[0], S.end[1]); ctx.stroke();
      }
      dotAt(ctx, S.end, true);
      if (S.target) mark(ctx, S.target);
    }
  }
  if (S.tool === 'compass') {
    var m = S.cmode, c = null;
    ctx.fillStyle = PENCIL; ctx.strokeStyle = PENCIL;
    if (m === 'needle') c = S.target ? vp(S.target) : S.end;
    else if (m === 'center') { if (S.end) dotAt(ctx, S.end, true); }
    else if (S.cc) c = vp(S.cc);
    if (c) {
      ctx.fillStyle = PENCIL;
      dotAt(ctx, c, true);
      if (S.rad > 0) {
        var r = S.rad, pa = m === 'rotate' ? S.pa0 + S.sweep : S.pa;
        ctx.strokeStyle = '#ffffff';
        arcLine(ctx, c, r, 0, TAU, 1.6 * ws * k);
        if (m === 'rotate' && S.hi - S.lo > 0.01) {
          ctx.strokeStyle = PENCIL;
          arcLine(ctx, c, r, S.pa0 + S.lo, S.hi - S.lo, 1.1 * ws * k);
        }
        var pen = [c[0] + r * Math.cos(pa), c[1] + r * Math.sin(pa)];
        if (m === 'radius') {
          ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.5 * ws * k;
          ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(pen[0], pen[1]); ctx.stroke();
          ctx.fillStyle = PENCIL; dotAt(ctx, pen, true);
        } else if (m === 'rotate') {
          ctx.fillStyle = GREEN; dotAt(ctx, pen, true);
        }
      }
    }
    if (S.target && (m === 'center' || m === 'needle' || m === 'radius')) mark(ctx, S.target);
  }
}

function sceneAll(ctx, ws) {
  if (S.mode === 'funk') { buildFunk(ctx, ws); return; }
  buildScene(ctx, ws);
  buildTemp(ctx, ws);
}

function drawLoupe(ctx) {
  var p = S.loupe;
  if (!p) return;
  var x = p[0], y = p[1], r = LOUPE_R, cx = x, cy = y - LOUPE_OFFSET;
  ctx.save();
  ctx.fillStyle = PARCH;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.clip();
  ctx.translate(cx, cy); ctx.scale(ZOOM, ZOOM); ctx.translate(-x, -y);
  ctx.translate(S.ox, S.oy); ctx.rotate(S.vth); ctx.scale(S.vs, S.vs);
  S.dsc = 0.45;
  try { sceneAll(ctx, 0.8 / ZOOM); }
  finally { S.dsc = 1; }
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 0.8; ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy);
  ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6);
  ctx.stroke();
  ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
}

function drawAll(ctx) {
  ctx.save();
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.fillStyle = PARCH;
  ctx.fillRect(0, 0, S.w, S.h);
  ctx.save();
  ctx.translate(S.ox, S.oy); ctx.rotate(S.vth); ctx.scale(S.vs, S.vs);
  sceneAll(ctx, 1);
  ctx.restore();
  drawLoupe(ctx);
  ctx.restore();
}

/* ===================== Bearbeiten ===================== */
function addEdge(a, b) { S.edges.push({ a: a, b: b, col: BLUE, gid: S.gid }); }

function merge(v, tgt) {
  S.edges.forEach(function (e) {
    if (e.a === v) e.a = tgt;
    if (e.b === v) e.b = tgt;
  });
  var out = [], seen = [];
  S.edges.forEach(function (e) {
    if (e.a === e.b) return;
    for (var i = 0; i < seen.length; i++) {
      if ((seen[i][0] === e.a && seen[i][1] === e.b) || (seen[i][0] === e.b && seen[i][1] === e.a)) return;
    }
    seen.push([e.a, e.b]);
    out.push(e);
  });
  S.edges = out;
}

function split(v) {
  var inc = S.edges.filter(function (e) { return e.a === v || e.b === v; });
  inc.slice(1).forEach(function (o) {
    var other = o.a === v ? o.b : o.a;
    var u = unit(vp(v), vp(other));
    var d = Math.min(24 * S.k, 0.4 * Math.hypot(other.x - v.x, other.y - v.y));
    var nv = V([v.x + u[0] * d, v.y + u[1] * d]);
    if (o.a === v) o.a = nv; else o.b = nv;
  });
}

/* ===================== Ansicht & Gesten ===================== */
function toWorld(pos) {
  var dx = pos[0] - S.ox, dy = pos[1] - S.oy;
  var c = Math.cos(-S.vth), s = Math.sin(-S.vth);
  return [(dx * c - dy * s) / S.vs, (dx * s + dy * c) / S.vs];
}
function applyView() { S.k = 1 / S.vs; render(); }
function resetView() {
  S.vs = 1; S.vth = 0;
  if (S.mode === 'funk') { S.ox = S.w / 2; S.oy = S.h * 0.48; } else { S.ox = 0; S.oy = 0; }
  applyView();
}

function cancelAction() {
  if (S.active && S.active_orig) { S.active.x = S.active_orig[0]; S.active.y = S.active_orig[1]; }
  if (S.cmode === 'radius') S.rad = S.rad_old;
  S.active = null; S.drawing = false; S.lmode = null; S.cutting = false; S.cmode = null;
  S.target = null; S.sweep = 0; S.lo = 0; S.hi = 0; S.loupe = null;
  render();
}

var G = {};
function twoFingers() { var a = Array.from(S.fingers.values()); return [a[0], a[1]]; }
function startGesture() {
  cancelAction();
  S.gesture = true;
  var f = twoFingers(), a = f[0], b = f[1];
  G.c0 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  G.d0 = Math.max(Math.hypot(b[0] - a[0], b[1] - a[1]), 10);
  G.s0 = S.vs; G.th0 = S.vth;

  if (x0 < 0 && x1 > 0) text(ctx, 'y', 13 * k, y0 + 122 * k, INK, 13);

  ctx.lineCap = 'round';
  F.lines.forEach(function (l) {
    ctx.strokeStyle = BLUE; extLine(ctx, l.a, l.b, 2.5 * ws * k);
    ctx.fillStyle = BLUE; dotAt(ctx, l.a, false); dotAt(ctx, l.b, false);
  });
  fpts(F.level).forEach(function (p) {
    ctx.fillStyle = BASEC; dotAt(ctx, [p.x, p.y], false, 5);
    text(ctx, p.n + '(' + fmt(p.mx) + '|' + fmt(p.my) + ')', p.x, p.y - 17 * k, INK, 13);
  });
  // Vorschau
  ctx.fillStyle = BLUE; ctx.strokeStyle = BLUE;
  if (S.ls) dotAt(ctx, vp(S.ls), true);
  if (S.drawing && S.end) {
    var e = S.target ? vp(S.target) : S.end;
    if (S.lmode === 'end' && S.ls && Math.hypot(e[0] - S.ls.x, e[1] - S.ls.y) > 1) {
      ctx.globalAlpha = 0.55; extLine(ctx, vp(S.ls), e, 2 * ws * k); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = BLUE; dotAt(ctx, e, true);
    if (S.target) mark(ctx, S.target);
  }
}

function fDown(pos) {
  S.drawing = true; S.lmode = S.ls ? 'end' : 'start';
  S.end = [pos[0], pos[1]]; S.target = fSnap(pos);
  S.loupe = S.sp; render();
  return true;
}
function fMove(pos) {
  if (S.drawing) { S.end = [pos[0], pos[1]]; S.target = fSnap(pos); }
  S.loupe = S.sp; render();
  return true;
}
function fUp(pos) {
  if (S.drawing) {
    var b = S.target ? vp(S.target) : S.end;
    if (S.lmode === 'start') {
      S.ls = V(b);
    } else if (S.ls && Math.hypot(b[0] - S.ls.x, b[1] - S.ls.y) > 12 * S.k) {
      F.gid += 1;
      F.lines.push({ a: vp(S.ls), b: b, gid: F.gid });
      S.ls = null;
    }
    S.drawing = false; S.lmode = null; S.target = null;
  }
  S.loupe = null; render();
  return true;
}
function fCheck() {
  var pts = fpts(F.level), tol = 0.15 * U, ok = false;
  F.lines.forEach(function (l) {
    var dx = l.b[0] - l.a[0], dy = l.b[1] - l.a[1], n = Math.hypot(dx, dy);
    if (n < 4) return;
    if (pts.every(function (p) { return Math.abs((p.x - l.a[0]) * dy - (p.y - l.a[1]) * dx) / n <= tol; })) ok = true;
  });
  if (ok !== S.done) {
    S.done = ok;
    if (ok) {
      F.solved.add(F.level);
      F.solutions[F.level] = fcopy(F.lines);
      delete F.work[F.level];
      fSave();
    }
    if (S.onLevel) S.onLevel(F.level, ok);
  }
}
function fLoadLevel(n, restore) {
  F.level = n; F.lines = []; F.gid = 0;
  S.ls = null; S.cc = null; resetTemp(); S.loupe = null; S.done = false;
  S.vs = 1; S.vth = 0; S.ox = S.w / 2; S.oy = S.h * 0.48;
  if (restore !== false) {
    var sn = F.solutions[n] || F.work[n];
    if (sn) {
      F.lines = fcopy(sn);
      F.gid = Math.max.apply(null, [0].concat(F.lines.map(function (l) { return l.gid; })));
    }
  }
  applyView();
  if (S.onLevel) S.onLevel(n, false);
  fCheck();
}
function fStore() { if (!F.solved.has(F.level)) F.work[F.level] = fcopy(F.lines); }
function fUndo() {
  if (S.ls) { S.ls = null; render(); return; }
  if (F.lines.length) { F.lines.pop(); render(); fCheck(); }
}
function fClear() {
  delete F.solutions[F.level]; delete F.work[F.level]; F.solved.delete(F.level);
  fLoadLevel(F.level, false); fSave();
}
function fNext() { fStore(); fLoadLevel((F.level + 1) % FLEVELS.length); fSave(); }
function fSave() {
  try {
    localStorage.setItem(FKEY, JSON.stringify({ solved: Array.from(F.solved), level: F.level, solutions: F.solutions, work: F.work }));
  } catch (e) { /* ignorieren */ }
}
function fLoad() {
  try {
    var raw = localStorage.getItem(FKEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    F.solved = new Set((d.solved || []).map(Number).filter(function (k) { return k >= 0 && k < FLEVELS.length; }));
    F.solutions = d.solutions || {}; F.work = d.work || {};
    var lv = Number(d.level || 0);
    F.level = lv >= 0 && lv < FLEVELS.length ? lv : 0;
  } catch (e) { /* ignorieren */ }
}

/* ===================== Oberfläche ===================== */
function init() {
  var canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var tools = { line: 'b-line', compass: 'b-compass', move: 'b-move', cut: 'b-cut' };
  var raf = 0;

  S.onRender = function () {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; drawAll(ctx); });
  };
  S.onTool = function (t) {
    Object.keys(tools).forEach(function (k) {
      document.getElementById(tools[k]).classList.toggle('on', k === t);
    });
  };
  S.onLevel = function (level, done) {
    hud.classList.toggle('ok', !!done);
    hud.textContent = '';
    if (level === null) return;
    var fk = S.mode === 'funk', L = fk ? FLEVELS : LEVELS, sv = fk ? F.solved : S.solved;
    if (done) {
      hud.textContent = sv.size === L.length
        ? (fk ? 'Level geschafft, sehr gut! Weitere Level folgen bald.' : 'Alle Level geschafft, sehr gut!')
        : 'Level ' + (level + 1) + ' geschafft! Tippe auf die Treppe für das nächste Level.';
    } else {
      var b = document.createElement('b');
      b.textContent = L[level].title + (sv.has(level) ? ' (schon gelöst)' : '');
      hud.appendChild(b);
      hud.appendChild(document.createTextNode(L[level].task));
    }
  };

  function resize() {
    var r = canvas.getBoundingClientRect();
    S.w = r.width; S.h = r.height;
    S.dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(S.w * S.dpr);
    canvas.height = Math.round(S.h * S.dpr);
    if (S.level === null && !S.loadedOnce && S.w > 150) {
      S.loadedOnce = true;
      loadLevel(S.start_level);
    }
    render();
  }
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
    onDown(e.pointerId, pos(e));
  });
  canvas.addEventListener('pointermove', function (e) {
    e.preventDefault();
    onMove(e.pointerId, pos(e));
  });
  canvas.addEventListener('pointerup', function (e) { e.preventDefault(); onUp(e.pointerId, pos(e)); });
  canvas.addEventListener('pointercancel', function (e) { onCancel(e.pointerId); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = pos(e), w = toWorld(p);
    if ((e.altKey || e.shiftKey) && S.mode !== 'funk') S.vth += e.deltaY * 0.002;
    else S.vs = Math.max(0.25, Math.min(8, S.vs * Math.exp(-e.deltaY * 0.0015)));
    var cs = Math.cos(S.vth), sn = Math.sin(S.vth);
    S.ox = p[0] - (w[0] * S.vs * cs - w[1] * S.vs * sn);
    S.oy = p[1] - (w[0] * S.vs * sn + w[1] * S.vs * cs);
    applyView();
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); });
  });

  function bind(id, fn) { document.getElementById(id).addEventListener('click', fn); }
  bind('b-line', function () { setTool('line'); });
  bind('b-compass', function () { setTool('compass'); });
  bind('b-move', function () { setTool('move'); });
  bind('b-cut', function () { setTool('cut'); });
  bind('b-undo', undo);
  bind('b-clear', clearAll);
  bind('b-view', resetView);
  bind('b-level', nextLevel);

  var home = document.getElementById('home'), inEuklid = false;
  function standText(n, total) { return n === 0 ? 'Noch nichts gelöst' : n + ' von ' + total + ' Leveln gelöst'; }
  function updateStand() {
    document.getElementById('euklid-stand').textContent = standText(S.solved.size, LEVELS.length);
    document.getElementById('funk-stand').textContent = standText(F.solved.size, FLEVELS.length);
  }
  function persist() {
    if (S.mode === 'funk') { fStore(); fSave(); } else if (S.mode === 'euklid') { storeCurrent(); saveProgress(); }
  }
  function showHome() {
    persist();
    S.fingers.clear(); S.gesture = false; S.main = null; S.hist = [];
    cancelAction();
    S.mode = 'home';
    inEuklid = false;
    updateStand();
    home.hidden = false;
  }
  function enter() {
    home.hidden = true;
    if (!inEuklid) {
      inEuklid = true;
      try { history.pushState({ e: 1 }, ''); } catch (e) {}
    }
    render();
  }
  function toolButtons(show) {
    ['b-compass', 'b-move', 'b-cut'].forEach(function (id) { document.getElementById(id).hidden = !show; });
  }
  function openEuklid() {
    S.mode = 'euklid';
    toolButtons(true);
    setTool('line');
    loadLevel(S.level === null ? S.start_level : S.level);
    enter();
  }
  function openFunk() {
    S.mode = 'funk';
    toolButtons(false);
    setTool('line');
    fLoadLevel(F.level);
    enter();
  }
  window.addEventListener('popstate', function () { if (inEuklid) showHome(); });
  bind('b-home', function () {
    if (history.state && history.state.e) history.back(); else showHome();
  });
  bind('a-euklid', openEuklid);
  bind('a-funk', openFunk);

  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);

  loadProgress();
  fLoad();
  updateStand();
  setTool('line');
  new ResizeObserver(resize).observe(canvas);
  resize();
  if (document.fonts) {
    document.fonts.load('400 12px Jost').then(render, function () {});
    if (document.fonts.ready) document.fonts.ready.then(render);
  }
}

if (typeof document === 'undefined') {
  module.exports = { S: S, LEVELS: LEVELS, onDown: onDown, onMove: onMove, onUp: onUp, setTool: setTool,
    loadLevel: loadLevel, undo: undo, snapshot: snapshot, restoreSnap: restoreSnap, checkLevel: checkLevel,
    storeCurrent: storeCurrent, V: V, vertices: vertices, resetView: resetView,
    F: F, fLoadLevel: fLoadLevel };
} else {
  init();
}
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
